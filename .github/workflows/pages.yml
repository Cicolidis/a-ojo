# Publica la PWA (carpeta app/) en GitHub Pages cuando cambia en main.
# Pages tiene que estar configurado con "Source: GitHub Actions".
name: App en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # El service worker usa el commit como versión de la caché: así cada deploy actualiza la app.
      - name: Versión del service worker
        run: sed -i "s/__VERSION__/${GITHUB_SHA::7}/" app/sw.js && grep -n "const VERSION" app/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v5
